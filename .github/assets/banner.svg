<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tiny MD - Lightweight Markdown Editor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0e1720"/>
      <stop offset="0.5" stop-color="#152a38"/>
      <stop offset="1" stop-color="#0d2736"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4FC3F7"/>
      <stop offset="1" stop-color="#007ACC"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#203544"/>
      <stop offset="1" stop-color="#1a2c3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#007ACC" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#007ACC" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <ellipse cx="960" cy="40" rx="420" ry="200" fill="url(#glow)"/>
  <ellipse cx="180" cy="290" rx="360" ry="160" fill="url(#glow)"/>

  <!-- Markdown logo mark -->
  <g transform="translate(72, 96)">
    <rect width="96" height="68" rx="12" fill="#ffffff"/>
    <text x="20" y="48" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="40" font-weight="700" fill="#152a38">M</text>
    <path d="M64 18 v22" stroke="#152a38" stroke-width="6" stroke-linecap="round"/>
    <path d="M55 33 L64 45 L73 33 Z" fill="#152a38"/>
  </g>

  <!-- Title & tagline -->
  <text x="196" y="140" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="1">Tiny MD</text>
  <rect x="200" y="158" width="264" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="198" y="196" font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" fill="#9fb3c8">轻量级 Markdown 编辑器 · Lightweight Markdown Editor</text>

  <!-- Feature chips -->
  <g font-family="'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="600">
    <rect x="198" y="216" width="98" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#4FC3F7" stroke-opacity="0.45"/>
    <text x="247" y="236" fill="#cfe8f7" text-anchor="middle">React 19</text>
    <rect x="306" y="216" width="112" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#4FC3F7" stroke-opacity="0.45"/>
    <text x="362" y="236" fill="#cfe8f7" text-anchor="middle">Electron 41</text>
    <rect x="428" y="216" width="126" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#4FC3F7" stroke-opacity="0.45"/>
    <text x="491" y="236" fill="#cfe8f7" text-anchor="middle">CodeMirror 6</text>
    <rect x="564" y="216" width="86" height="30" rx="15" fill="#ffffff" fill-opacity="0.08" stroke="#4FC3F7" stroke-opacity="0.45"/>
    <text x="607" y="236" fill="#cfe8f7" text-anchor="middle">Marked</text>
  </g>

  <!-- Four-panel layout mockup -->
  <g>
    <rect x="768" y="52" width="368" height="196" rx="14" fill="url(#panel)" stroke="#2c4a5e"/>
    <!-- panel 1: file tree -->
    <rect x="768" y="52" width="76" height="196" rx="14" fill="#1b2d3b"/>
    <rect x="782" y="76" width="40" height="7" rx="3.5" fill="#4FC3F7"/>
    <rect x="782" y="96" width="48" height="6" rx="3" fill="#3d5a70"/>
    <rect x="782" y="112" width="34" height="6" rx="3" fill="#3d5a70"/>
    <rect x="782" y="128" width="44" height="6" rx="3" fill="#3d5a70"/>
    <rect x="782" y="144" width="38" height="6" rx="3" fill="#f8d775" fill-opacity="0.7"/>
    <rect x="782" y="160" width="42" height="6" rx="3" fill="#3d5a70"/>
    <!-- panel 2: editor -->
    <rect x="850" y="58" width="110" height="184" rx="8" fill="#142430"/>
    <rect x="862" y="76" width="60" height="6" rx="3" fill="#7fd1f7"/>
    <rect x="862" y="92" width="84" height="6" rx="3" fill="#3d5a70"/>
    <rect x="862" y="108" width="70" height="6" rx="3" fill="#3d5a70"/>
    <rect x="862" y="124" width="88" height="6" rx="3" fill="#80cbc4" fill-opacity="0.8"/>
    <rect x="862" y="140" width="56" height="6" rx="3" fill="#3d5a70"/>
    <rect x="862" y="156" width="78" height="6" rx="3" fill="#3d5a70"/>
    <rect x="862" y="172" width="64" height="6" rx="3" fill="#ce93d8" fill-opacity="0.7"/>
    <!-- panel 3: preview -->
    <rect x="966" y="58" width="100" height="184" rx="8" fill="#f4f7f9"/>
    <rect x="976" y="74" width="48" height="9" rx="2" fill="#33475a"/>
    <rect x="976" y="94" width="80" height="6" rx="3" fill="#8fa6b5"/>
    <rect x="976" y="108" width="72" height="6" rx="3" fill="#8fa6b5"/>
    <rect x="976" y="130" width="80" height="26" rx="5" fill="#22303c"/>
    <rect x="984" y="138" width="44" height="4" rx="2" fill="#7fd1f7"/>
    <rect x="984" y="146" width="56" height="4" rx="2" fill="#4a6172"/>
    <rect x="976" y="168" width="64" height="6" rx="3" fill="#8fa6b5"/>
    <rect x="976" y="182" width="76" height="6" rx="3" fill="#8fa6b5"/>
    <!-- panel 4: translation -->
    <rect x="1072" y="58" width="58" height="184" rx="8" fill="#142430"/>
    <rect x="1082" y="76" width="38" height="6" rx="3" fill="#f8d775" fill-opacity="0.8"/>
    <rect x="1082" y="92" width="38" height="6" rx="3" fill="#3d5a70"/>
    <rect x="1082" y="108" width="38" height="6" rx="3" fill="#3d5a70"/>
    <rect x="1082" y="124" width="38" height="6" rx="3" fill="#3d5a70"/>
    <rect x="1082" y="148" width="38" height="6" rx="3" fill="#80cbc4" fill-opacity="0.8"/>
    <rect x="1082" y="164" width="38" height="6" rx="3" fill="#3d5a70"/>
  </g>
</svg>
